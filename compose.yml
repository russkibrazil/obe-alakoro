services:
  db:
    image: mysql:8.0
    container_name: shop-db
    restart: always
    environment:
      MYSQL_DATABASE: loja_virtual
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_USER: user_app
      MYSQL_PASSWORD: user_password_here
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_here"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./alaroko-store
      dockerfile: Dockerfile
    container_name: nextjs-app
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://user_app:user_password_here@db:3306/loja_virtual?connection_limit=20&pool_timeout=30
      DATABASE_HOST: "db"
      DATABASE_USER: "root"
      DATABASE_PASSWORD: "user_password_here"
      DATABASE_NAME: "loja_virtual"
      NODE_ENV: production

volumes:
  mysql_data:
